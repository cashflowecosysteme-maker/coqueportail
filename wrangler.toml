name = "__WORKER_NAME__"
main = "_worker.js"
compatibility_date = "2026-09-24"
workers_dev = false
preview_urls = false
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "__HOST__"
zone_name = "nyxia.top"
custom_domain = true

[[kv_namespaces]]
binding = "CASHFLOW_KV"
id = "106db6da016d49d2b480452f19bad695"

[[d1_databases]]
binding = "DB"
database_name = "nyxia-cercles-db"
database_id = "a21fd813-06fa-41f1-b744-07bf1c5c7951"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "univers-livres"

[vars]
SITE_URL = "https://__HOST__"
PORTAIL = "__PORTAL_ID__"
PORTAL_SLUG = "__PORTAL_ID__"
