<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>__PORTAL_TITLE__ — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <canvas id="starry-canvas"></canvas>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <img src="__PORTAL_LOGIN_IMAGE__" alt="__PORTAL_SHORT_TITLE__" class="login-avatar" onerror="this.style.display='none'">
        <div class="login-title">__PORTAL_SHORT_TITLE__</div>
        <div class="login-subtitle">__PORTAL_WELCOME__</div>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="firstname">Ton prénom</label>
          <input class="form-input" type="text" id="firstname" placeholder="Ton prénom" autocomplete="given-name">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Adresse email</label>
          <input class="form-input" type="email" id="email" placeholder="ton@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:44px">
            <button type="button" class="toggle-pw" id="toggle-pw" title="Afficher/masquer">👁</button>
          </div>
        </div>
        <button class="btn-login" id="login-btn" type="submit">
          <div class="spinner" id="spinner"></div><span id="btn-text">Se connecter</span>
        </button>
        <div class="msg-box" id="login-msg" aria-live="polite"></div>
      </form>
      <div class="login-footer"><span>© 2026 NyXia — __PORTAL_SHORT_TITLE__</span></div>
    </div>
  </div>
  <script>window.NYXIA_PORTAL_TITLE=__PORTAL_TITLE_JSON__;</script>
  <script src="/js/starry-bg.js" defer></script>
  <script src="/js/login.js" defer></script>
</body>
</html>
