<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/images/FavIcon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fripouille — NyXia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0A1628;--bg2:#0F1C3F;--bg3:#1A2554;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--t4:#4a5278;--green:#00E676;--gold:#F4C842}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg1);color:var(--t2);font-family:Outfit,sans-serif;display:flex}
#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.chat-area{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;overflow:hidden;width:100%;max-width:900px;margin:0 auto}
.chat-header{padding:16px 24px;border-bottom:1px solid rgba(123,92,255,.1);background:rgba(10,22,40,.7);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;flex-shrink:0}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(123,92,255,.4);box-shadow:0 0 24px rgba(123,92,255,.35)}
.avatar-fallback{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p),var(--p3));font-size:20px}
.chat-header-info{flex:1}.chat-header-name{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;background:linear-gradient(135deg,#a78bfa,var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.chat-header-sub{font-size:12px;color:var(--t3)}
.btn{border:1px solid rgba(123,92,255,.3);background:rgba(123,92,255,.1);color:var(--t2);font-family:Outfit,sans-serif;font-size:12px;padding:8px 12px;border-radius:50px;cursor:pointer}.btn:hover{background:rgba(123,92,255,.2)}
.messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;max-width:82%}.msg.user{align-self:flex-end;flex-direction:row-reverse}.msg.bot{align-self:flex-start}
.msg-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(123,92,255,.3);flex-shrink:0}
.bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.bot .bubble{background:rgba(26,37,84,.72);border:1px solid rgba(123,92,255,.12);border-top-left-radius:4px}.user .bubble{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-top-right-radius:4px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 14px}.chip{border:1px solid rgba(123,92,255,.25);background:rgba(123,92,255,.08);color:var(--t2);border-radius:50px;padding:8px 14px;font-family:Outfit,sans-serif;font-size:12px;cursor:pointer}
.attach{display:none;padding:7px 20px;background:rgba(123,92,255,.08);border-top:1px solid rgba(123,92,255,.1);font-size:12px;color:var(--t3)}
.input-wrap{padding:14px 20px;border-top:1px solid rgba(123,92,255,.1);background:rgba(10,22,40,.82);display:flex;gap:9px;align-items:flex-end}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(123,92,255,.2);background:rgba(123,92,255,.06);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center}
textarea{flex:1;min-height:42px;max-height:120px;resize:none;background:rgba(15,28,63,.75);border:1px solid rgba(123,92,255,.2);border-radius:13px;color:#fff;font:14px Outfit,sans-serif;padding:10px 13px;outline:none}
.send{width:42px;height:42px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:16px;cursor:pointer;box-shadow:0 0 20px rgba(123,92,255,.35)}
.hint{text-align:center;font-size:11px;color:var(--t4);padding:5px 0 8px}
.media-card{margin-top:8px;max-width:520px}.media-card img,.media-card video{max-width:100%;border-radius:12px;border:1px solid rgba(123,92,255,.2)}.media-card audio{width:100%}
.typing{opacity:.8}
@media(max-width:700px){.messages{padding:16px}.input-wrap{padding:12px 14px}.suggestions{padding:0 14px 10px}.chat-header{padding:12px 14px}.msg{max-width:92%}}
</style>
<link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="chat-area">
  <div class="chat-header">
    <span id="header-avatar"></span>
    <div class="chat-header-info">
      <div class="chat-header-name">Fripouille</div>
      <div class="chat-header-sub">Personnage NyXia</div>
    </div>
    <button class="btn" onclick="formation()">🎓 Formation Vivante</button>
    <button class="btn" onclick="newChat()">✨ Nouveau chat</button>
  </div>
  <div id="messages" class="messages"></div>
  <div class="suggestions">
    <button class="chip" onclick="useSuggestion(this)">Aide-moi à avancer aujourd’hui</button>
    <button class="chip" onclick="useSuggestion(this)">Explique-moi simplement la prochaine étape</button>
    <button class="chip" onclick="useSuggestion(this)">Continue ma formation</button>
  </div>
  <div id="attach" class="attach"></div>
  <div class="input-wrap">
    <label class="icon-btn" title="Joindre un fichier">📎<input id="file" type="file" accept=".pdf,.zip,image/*" style="display:none"></label>
    <button class="icon-btn" id="mic" onclick="toggleMic()" title="Parler">🎤</button>
    <textarea id="input" rows="1" placeholder="Écris ou parle à Fripouille..."></textarea>
    <button class="send" id="send" onclick="send()">➤</button>
  </div>
  <div class="hint">Entrée pour envoyer · Shift+Entrée pour un retour à la ligne</div>
</div>
<script src="/js/starry-bg.js" defer></script>
<script>
const AGENT={"key":"fripouille","name":"Fripouille","sub":"Personnage NyXia","icon":"✨","image":"https://d1yei2z3i6k35z.cloudfront.net/1872133/6ab689ec76cc00.75260535_Fripouille.png","custom":true,"portail":"","voiceEnv":"ELEVENLABS_FRIPOUILLE_VOICE_ID","voiceId":"piI8Kku0DcvcL6TTSeQt","greeting":"Je suis là. Dis-moi ce que tu veux faire avancer dans ce portail."};
const tokenParam=new URLSearchParams(location.search).get('t')||'';
let sessionToken=tokenParam||sessionStorage.getItem('nyxia_token')||'';
if(sessionToken)sessionStorage.setItem('nyxia_token',sessionToken);
let clientName=localStorage.getItem('nyxia_username')||'toi',history=[],attachment=null,recognition=null,listening=false;
const storeKey='nyxia_chat_'+AGENT.key;
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function avatarHtml(cls='msg-avatar'){return AGENT.image?'<img class="'+cls+'" src="'+esc(AGENT.image)+'" alt="'+esc(AGENT.name)+'" onerror="this.style.display=\\'none\\';this.nextElementSibling.style.display=\\'flex\\'"><span class="avatar-fallback" style="display:none">'+esc(AGENT.icon||'✦')+'</span>':'<span class="avatar-fallback">'+esc(AGENT.icon||'✦')+'</span>'}
function initAvatar(){$('header-avatar').innerHTML=avatarHtml('avatar')}
function save(){try{sessionStorage.setItem(storeKey,JSON.stringify(history.slice(-40)))}catch(e){}}
function load(){try{const r=sessionStorage.getItem(storeKey);if(r)history=JSON.parse(r)||[]}catch(e){history=[]}}
function add(role,text,saveIt=true){
 const row=document.createElement('div');row.className='msg '+role;
 if(role==='bot')row.innerHTML=avatarHtml();
 const b=document.createElement('div');b.className='bubble';renderContent(b,text);row.appendChild(b);$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight;
 if(saveIt){history.push({role:role==='bot'?'assistant':'user',content:String(text||'')});history=history.slice(-40);save()}
}
function renderContent(host,text){
 const raw=String(text||'');
 const media=[];
 const cleaned=raw.replace(/\[(IMAGE|VIDEO|AUDIO)\s*:\s*(https:\/\/[^\]\s]+)\]/gi,(m,k,u)=>{media.push({k:k.toUpperCase(),u});return ''}).trim();
 host.textContent=cleaned;
 for(const m of media){
   const w=document.createElement('div');w.className='media-card';
   if(m.k==='IMAGE'){const x=document.createElement('img');x.src=m.u;x.alt='Ressource';w.appendChild(x)}
   if(m.k==='VIDEO'){const x=document.createElement('video');x.src=m.u;x.controls=true;x.playsInline=true;w.appendChild(x)}
   if(m.k==='AUDIO'){const x=document.createElement('audio');x.src=m.u;x.controls=true;w.appendChild(x)}
   host.appendChild(w);
 }
}
function typing(on){let e=$('typing');if(on&&!e){e=document.createElement('div');e.id='typing';e.className='msg bot typing';e.innerHTML=avatarHtml()+'<div class="bubble">•••</div>';$('messages').appendChild(e);$('messages').scrollTop=$('messages').scrollHeight}else if(!on&&e)e.remove()}
function welcome(){if(history.length)return renderHistory();add('bot',AGENT.greeting,false)}
function renderHistory(){const copy=history.slice();history=[];for(const m of copy)add(m.role==='assistant'?'bot':'user',m.content,true)}
async function auth(){
 if(!sessionToken){location.replace('/login.html');return}
 try{const r=await fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionToken})});const d=await r.json();if(!d.valid){location.replace('/login.html');return}clientName=d.firstname||clientName}catch(e){}
 initAvatar();load();welcome()
}
function useSuggestion(btn){$('input').value=btn.textContent.trim();send()}
function formation(){$('input').value='Continue ma formation';send()}
async function fileToAttachment(file){
 if(file.size>8*1024*1024)throw Error('Le fichier dépasse 8 Mo.');
 const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(file)});
 return{name:file.name,type:file.type||'application/octet-stream',data:b64};
}
$('file').addEventListener('change',async function(){const f=this.files&&this.files[0];if(!f)return;try{attachment=await fileToAttachment(f);$('attach').style.display='block';$('attach').textContent='📎 '+f.name+' · joint au prochain message'}catch(e){alert(e.message)}this.value=''});
async function send(){
 const input=$('input'),text=input.value.trim();if(!text&&!attachment)return;
 const shown=text+(attachment?'\n📎 '+attachment.name:'');add('user',shown);input.value='';input.style.height='auto';typing(true);$('send').disabled=true;
 const att=attachment;attachment=null;$('attach').style.display='none';
 try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-12,-1),userName:clientName,agent:AGENT.key,attachment:att,token:sessionToken})});
   const d=await r.json().catch(()=>({}));
   typing(false);
   if(!r.ok)throw Error(d.error||'Réponse indisponible.');
   add('bot',d.content||'Petite interruption… réessaie dans un instant 💜');
 }catch(e){typing(false);add('bot','⚠ '+(e.message||'Petite interruption… réessaie.'))}
 finally{$('send').disabled=false}
}
function newChat(){if(!confirm('Effacer cette conversation avec '+AGENT.name+' ?'))return;history=[];save();$('messages').innerHTML='';add('bot',AGENT.greeting,false)}
$('input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function toggleMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('La reconnaissance vocale est disponible surtout dans Chrome ou Edge.');
 if(listening){try{recognition.stop()}catch(e){}return}
 recognition=new SR();recognition.lang='fr-FR';recognition.interimResults=false;recognition.onstart=()=>{listening=true;$('mic').textContent='⏹'};recognition.onend=()=>{listening=false;$('mic').textContent='🎤'};recognition.onerror=recognition.onend;recognition.onresult=e=>{$('input').value=e.results[0][0].transcript;send()};recognition.start();
}
auth();
</script>
</body>
</html>
